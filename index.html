:root{
  --yellow:#FFD84D;  --yellow-deep:#F0A81E;
  --pink:#FF8FB1;    --pink-deep:#F2749B;
  --blue:#6EC5FF;    --blue-deep:#2FA3EE;
  --mint:#7EE0C0;    --mint-deep:#2A9E7B;
  --lilac:#C4A9FF;   --lilac-deep:#6B4FC4;
  --peach:#FFB088;   --peach-deep:#D9702F;
  --cream:#FFF9F0;   --card:#FFFFFF;   --sunk:#FDF3E7;
  --ink:#3D3A4E;     --ink-60:#8B879B; --ink-30:#C9C5D4;
  --line:#F1EADF;    --line-gray:#E3E0E8;
  --pink-cta:#D6337A;  --pink-cta-lite:#DE4B8B;
  --red:#F58A93;     --red-deep:#D64550;
  --shadow-soft:0 4px 14px rgba(61,58,78,.07);
  --shadow-pop:0 8px 22px rgba(255,143,177,.22);
  --r-card:20px; --r-pill:999px; --r-field:16px;
  --spring:cubic-bezier(.34,1.4,.5,1);
  --swipe-w:88px;
  --tabbar-h:78px;              /* tabbar 內容高（不含安全區） */
  --tabbar-total:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","Nunito",system-ui,sans-serif;
  --num:"Munchi Num","Nunito","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{
  font-family:var(--body); color:var(--ink);
  background:linear-gradient(155deg,#FFE9A8 0%,#FFD3E2 48%,#CFE8FF 100%);
  background-attachment:fixed;
  min-height:100dvh; line-height:1.5;
  width:100%; max-width:100%; overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue-deep);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{
  width:100%; max-width:430px; margin:0 auto; background:var(--cream);
  height:100vh; height:100dvh; display:flex; flex-direction:column;
  position:relative; overflow:hidden;
}
@media(min-width:520px){
  .app{margin:22px auto; height:calc(100dvh - 44px); min-height:600px;
       border-radius:34px; box-shadow:0 26px 60px rgba(61,58,78,.25)}
}
.scroll{flex:1 1 0; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
  padding:0 18px 26px}

.topbar{padding:22px 20px 12px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.hello{font-family:var(--display); font-size:24px; font-weight:800; letter-spacing:.2px}
.today-date{font-size:12.5px; color:var(--ink-60); font-weight:500; margin-top:2px}
.hello-row{display:flex; align-items:center; gap:6px}
.hello[contenteditable="true"]{outline:none; border-bottom:2px dashed var(--pink-deep); min-width:2em}
.edit-name{width:28px; height:28px; display:grid; place-items:center; flex:none;
  border:0; padding:0; border-radius:50%; background:transparent; color:var(--ink-60);
  cursor:pointer; transition:background .18s, color .18s, transform .18s}
.edit-name:hover{background:#fff; color:var(--pink-deep); box-shadow:var(--shadow-soft)}
.edit-name:active{transform:scale(.92)}
.edit-name svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
/* 右上角分享：直接把今天的圖卡丟進系統分享 */
.share-today{width:40px; height:40px; display:grid; place-items:center; flex:none; align-self:flex-start;
  border:0; padding:0; border-radius:50%; background:var(--card); color:var(--pink-cta);
  box-shadow:var(--shadow-soft); cursor:pointer; transition:transform .16s var(--spring), box-shadow .2s ease}
.share-today:hover{box-shadow:var(--shadow-pop)}
.share-today:active{transform:scale(.92)}
.share-today svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round}

/* ---------- cards ---------- */
.card{background:var(--card); border-radius:var(--r-card); padding:18px; box-shadow:var(--shadow-soft)}
.stack{display:flex; flex-direction:column; gap:14px}
.sec-title{font-family:var(--display); font-size:16px; font-weight:700; padding:2px 4px 0}

/* ---------- 貓咪對話框 ---------- */
.cat-stage{display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:6px}
.cat-bubble{
  position:relative; max-width:280px; margin:0 auto;
  background:var(--card); color:var(--ink);
  border-radius:18px; padding:11px 15px 12px;
  font-size:13px; line-height:1.55; font-weight:500; text-align:center;
  box-shadow:var(--shadow-soft); cursor:pointer;
  transition:transform .18s var(--spring), box-shadow .18s;
  animation:bubblepop .34s var(--spring) both;
}
.cat-bubble:hover{box-shadow:var(--shadow-pop)}
.cat-bubble:active{transform:scale(.97)}
.cat-bubble b{color:var(--pink-cta); font-weight:800; font-family:var(--num);
  font-variant-numeric:tabular-nums}
/* 泡泡尾巴：兩個小圓點指向貓咪 */
.cat-bubble::after,.cat-bubble::before{content:""; position:absolute; left:50%;
  background:var(--card); border-radius:50%; box-shadow:var(--shadow-soft)}
.cat-bubble::after{width:10px; height:10px; bottom:-7px; margin-left:-16px}
.cat-bubble::before{width:6px; height:6px; bottom:-16px; margin-left:-4px}
@keyframes bubblepop{
  0%{opacity:0; transform:translateY(6px) scale(.9)}
  100%{opacity:1; transform:translateY(0) scale(1)}
}
@media(prefers-reduced-motion:reduce){
  .cat-bubble{animation:none}
}

/* ---------- 今日進度長條 ---------- */
.barcard{padding:20px 18px 16px; background:
   radial-gradient(120% 90% at 50% 0%, #FFFDF7 0%, #FFFFFF 60%)}
.bars{display:flex; flex-direction:column; gap:18px}
.bar-head{display:flex; align-items:flex-end; gap:8px; margin-bottom:8px}
.bar-label{display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:500}
.bar-val{margin-left:auto; font-family:var(--num); font-variant-numeric:tabular-nums;
  white-space:nowrap; line-height:1}
.bar-val b{font-size:21px; font-weight:800; letter-spacing:-.4px}
.bar-val span{font-size:12px; font-weight:600; color:var(--ink-60)}
.bar-track{position:relative; height:7px; border-radius:var(--r-pill);
  background:var(--sunk); overflow:hidden}
.bar-fill{position:absolute; left:0; top:0; bottom:0; width:0;
  border-radius:var(--r-pill); background:var(--ink-30);
  transition:width .85s var(--spring), background-color .3s ease}
/* 超過上限：加斜紋，不靠顏色單一訊號 */
.bar-fill.over{background-image:repeating-linear-gradient(115deg,
  rgba(255,255,255,.55) 0 4px, rgba(255,255,255,0) 4px 9px)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.status{margin-top:14px; font-size:13.5px; font-weight:500; line-height:1.55;
  color:var(--ink-60); padding:10px 6px 2px}
.status b{color:var(--ink)}
.status.done{color:var(--mint-deep); font-weight:700}
.status.over{color:var(--peach-deep); font-weight:700}
.status.warn{color:var(--lilac-deep); font-weight:700}
/* 首頁「還差…」那句話改成三張數字卡：數字在上、文字在下（同紀錄頁的 .stat） */
.trainrow{display:flex; justify-content:flex-end; margin:0 0 10px}
.trainbtn{display:inline-flex; align-items:center; gap:6px; border:0; cursor:pointer;
  padding:6px 11px; border-radius:var(--r-pill); background:var(--sunk); color:var(--ink-60);
  font-family:var(--body); font-size:12px; font-weight:700;
  transition:background .2s ease, color .2s ease}
.trainbtn svg{width:15px; height:15px; fill:none; stroke:currentColor;
  stroke-width:1.8; stroke-linecap:round}
.trainbtn[aria-pressed="true"]{background:#EFE9FF; color:var(--lilac-deep)}
.todaystats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:2px 0 20px}
.tstat{background:none; border:0; border-radius:0;
  padding:2px 4px; text-align:center}
.tstat b{display:block; font-family:var(--num); font-size:19px; font-weight:800;
  letter-spacing:-.4px; line-height:1.2; font-variant-numeric:tabular-nums}
.tstat b.word{font-family:var(--body); font-size:15px}
.tstat span{display:block; margin-top:3px; font-size:10.5px; color:var(--ink-60); font-weight:400}
.bars+.status{margin-top:14px; padding:6px 6px 0; text-align:center; font-size:12.5px}

/* ---------- note ---------- */
.note{display:flex; gap:12px; align-items:flex-start; padding:15px 16px}
.note::before{content:""; width:3px; align-self:stretch; border-radius:99px;
  background:var(--blue); flex:none}
.note p{font-size:12.5px; line-height:1.65; color:var(--ink-60)}
.note p b{color:var(--ink)}
.note-t{font-family:var(--display); font-size:12.5px; font-weight:700; color:var(--ink);
  display:block; margin-bottom:2px}

/* ---------- today log ---------- */
.logcard{padding:4px 16px; overflow:hidden}
.logrow{display:flex; align-items:center; gap:11px; padding:9px 0}
.log-name{flex:1; min-width:0; font-size:14px; font-weight:400;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.log-pro{font-family:var(--num); font-size:15px; font-weight:800; text-align:right;
  font-variant-numeric:tabular-nums; flex:none; color:var(--pink-deep); white-space:nowrap}
.log-pro small{display:block; font-size:10px; font-weight:600; color:var(--ink-30)}
.log-kcal{font-family:var(--num); font-weight:800; font-size:15px; text-align:right;
  font-variant-numeric:tabular-nums; flex:none; min-width:50px}
.log-kcal small{display:block; font-size:10px; font-weight:600; color:var(--ink-30)}
.logsum{display:flex; justify-content:space-between; align-items:center;
  padding:12px 0; font-size:12.5px; font-weight:700; color:var(--ink-60)}
.logsum b{font-family:var(--num); color:var(--ink); font-variant-numeric:tabular-nums}
.sec-hint{font-size:11px; font-weight:600; color:var(--ink-30); padding-left:8px}

/* ---------- 右滑刪除 ---------- */
.swipe{position:relative; overflow:hidden; margin:0 -16px}
.swipe-bg{position:absolute; inset:0; display:flex; align-items:center; background:var(--pink-cta);
  opacity:0; pointer-events:none}
.swipe.dragging .swipe-bg, .swipe.open .swipe-bg, .swipe.removing .swipe-bg,
.swipe:focus-within .swipe-bg{opacity:1; pointer-events:auto}
.swipe-del{display:flex; align-items:center; gap:6px; align-self:stretch; padding:0 18px;
  color:#FFF9F0; font-family:var(--display); font-weight:700; font-size:13.5px; white-space:nowrap}
.swipe-del svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round}
.swipe-del:active{transform:scale(.94)}
.swipe-fg{position:relative; background:var(--card); box-shadow:0 0 0 .5px var(--card);
  touch-action:pan-y;
  transition:transform .3s var(--spring)}
.swipe-fg .logrow{padding:9px 16px}
.swipe.dragging .swipe-fg{transition:none}
.swipe:focus-within .swipe-fg{transform:translateX(var(--swipe-w))}
.swipe-fg{cursor:pointer}
.swipe .swipe-fg:focus{transform:none; outline:none}
.swipe .swipe-fg:focus-visible{box-shadow:inset 0 0 0 2px var(--blue)}
.swipe.removing{height:0 !important; opacity:0;
  transition:height .26s ease, opacity .18s ease}

/* ---------- tabbar + fab ---------- */
.tabbar{display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  height:var(--tabbar-total);
  background:#fff; border-top:1px solid var(--line); flex:none}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 0 5px; border-radius:16px; color:var(--ink-30); font-size:10.5px; font-weight:700;
  transition:color .2s ease}
.tab .ic{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; transition:transform .3s var(--spring), stroke-width .2s ease}
/* 選中狀態：不用色塊底，改「粉色 + 加粗線條 + 底部小圓點」三重訊號 */
.tab::after{content:""; width:5px; height:5px; border-radius:50%; background:currentColor;
  opacity:0; transform:scale(.3);
  transition:opacity .2s ease, transform .32s var(--spring)}
.tab[aria-current="page"]{color:var(--pink-deep)}
.tab[aria-current="page"] .ic{transform:translateY(-2px) scale(1.12); stroke-width:2.2}
.tab[aria-current="page"]::after{opacity:1; transform:none}
.fab{position:absolute; right:18px; bottom:calc(var(--tabbar-total) + 16px); width:60px; height:60px; border-radius:50%;
  background:linear-gradient(150deg,var(--yellow),var(--pink)); color:#fff; font-size:30px;
  font-weight:700; line-height:1; display:grid; place-items:center; box-shadow:var(--shadow-pop);
  transition:transform .2s var(--spring); z-index:20}
/* 用 SVG 畫十字，不用全形「＋」字元：字型的基線會讓字元偏上/偏左，對不準圓心 */
.fab svg{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round}
.fab:active{transform:scale(.9)}

/* ---------- sheet ---------- */
.backdrop{position:absolute; inset:0; background:rgba(61,58,78,.4); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .28s ease}
.backdrop.open{opacity:1; pointer-events:auto}
.sheet{position:absolute; left:0; right:0; bottom:0; max-height:88%; background:var(--card);
  border-radius:28px 28px 0 0; padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; transform:translateY(102%);
  transition:transform .34s var(--spring)}
.backdrop.open .sheet{transform:translateY(0)}
/* sheet 改白底後，內層白色卡片補一條細邊界維持層次 */
.sheet .block, .sheet .food, .sheet .field{border:1px solid var(--line)}
.grab{width:42px;height:5px;border-radius:99px;background:var(--ink-30);margin:6px auto 12px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;padding-bottom:12px}
.x{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;
  font-size:16px;color:var(--ink-60);flex:none}
.sheet-body{overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-bottom:6px}

.segrow{display:flex; gap:6px; background:var(--sunk); padding:4px; border-radius:var(--r-pill)}
.seg{flex:1; padding:8px 4px; border-radius:var(--r-pill); font-size:13px; font-weight:700;
  color:var(--ink-60); transition:background .2s ease, color .2s ease}
.seg[aria-pressed="true"]{background:#fff; color:var(--ink); box-shadow:var(--shadow-soft)}

/* ---------- 補記日期 ---------- */
.datenote{font-size:11.5px; color:var(--ink-60); text-align:center; line-height:1.5}
.datenote b{color:var(--pink-deep); font-weight:800}
/* 補記是另一個彈窗：紫色標籤＋提示條，一眼跟「記今天」分得出來 */
.kind-tag{display:inline-block; margin-right:6px; padding:1px 8px; border-radius:var(--r-pill);
  background:var(--lilac-deep); color:#FFF9F0; font-family:var(--display); font-size:11.5px;
  font-weight:800; vertical-align:2px}
.backnote{background:#F1EBFF; color:var(--lilac-deep); border-radius:var(--r-field);
  padding:9px 12px; font-size:12px; font-weight:600; text-align:center; line-height:1.5}
.backnote b{font-weight:800}
/* 份數 */
.servrow{display:flex; align-items:center; gap:10px}
.servrow > span{font-size:10.5px; font-weight:700; color:var(--ink-60); flex:none}
.servrow .segrow{flex:1}
.servrow .seg{font-family:var(--num); font-weight:800}
.addday{color:var(--ink-60)}
.block{background:#fff; border-radius:var(--r-card); padding:14px; box-shadow:var(--shadow-soft);
  display:flex; flex-direction:column; gap:10px}
.block-h{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.block-h b{font-family:var(--display); font-size:14.5px}
.block-h span{font-size:11px; color:var(--ink-60)}
.field{background:var(--sunk)}

.foodwrap{display:flex; flex-wrap:wrap; gap:7px}
.food{display:inline-flex; align-items:baseline; gap:7px; width:auto; flex:0 0 auto;
  background:#fff; border-radius:var(--r-pill); padding:9px 14px; box-shadow:var(--shadow-soft);
  font-size:13px; font-weight:500; white-space:nowrap; transition:transform .16s var(--spring)}
.food:active{transform:scale(.94)}
.food .fm{font-family:var(--num); font-size:11px; color:var(--ink-30);
  font-variant-numeric:tabular-nums; display:inline-flex; gap:5px}
.food .fm b{color:var(--pink-deep); font-weight:800}
.food-key{font-size:11px; color:var(--ink-60); font-weight:500; padding:0 4px; line-height:1.6}
.food-key b{color:var(--pink-deep); font-weight:800}

.del{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line-gray);
  color:var(--ink-60);display:grid;place-items:center;flex:none}
.del svg{width:12px;height:12px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.field{background:#fff;border-radius:var(--r-field);padding:8px 12px;box-shadow:var(--shadow-soft)}
.field label{display:block;font-size:10.5px;font-weight:700;color:var(--ink-60)}
.field label .req{color:var(--pink-deep);font-style:normal;margin-left:1px}
/* font-size 一定要 >=16px，否則 iOS Safari 聚焦時會自動放大整個畫面，關掉面板後縮放不會還原 → 跑版 */
.field input{width:100%;border:0;background:none;font-family:var(--num);font-size:16px;font-weight:700;padding:1px 0}
.field input:focus{outline:none}
.field:focus-within{box-shadow:0 0 0 2px var(--blue)}
.span2{grid-column:span 2}
.btn{border-radius:var(--r-pill); padding:14px; font-family:var(--display); font-weight:700;
  font-size:15px; text-align:center; transition:transform .16s var(--spring)}
.btn:active{transform:scale(.96)}
.btn-main{background:var(--pink-cta-lite); color:#fff; box-shadow:var(--shadow-pop)}
.btn-soft{background:var(--sunk); color:var(--ink)}
.btn-danger{background:var(--card); color:var(--red-deep);
  border:2px solid var(--red-deep); padding:12px}
.sheet-title{font-family:var(--display); font-size:15px; font-weight:800; margin-bottom:2px}
.editsum{font-size:12px; color:var(--ink-60); text-align:center; font-variant-numeric:tabular-nums}
.editsum b{font-family:var(--num); color:var(--ink); font-weight:800}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 12px}
.calhead b{font-family:var(--display);font-size:17px}
.navbtn{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:15px}
.navbtn[disabled]{opacity:.3}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.dow span{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-30)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{position:relative;aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-family:var(--num);font-size:12.5px;font-weight:700;color:var(--ink-30);
  transition:background .2s ease}
.day.has{color:var(--ink)}
.day.sel{background:#FFE3EC;color:var(--pink-cta);box-shadow:inset 0 0 0 2px var(--pink-deep)}
.day.today{box-shadow:inset 0 0 0 2px var(--pink-deep)}
.day.train::before{content:"";position:absolute;top:5px;right:5px;width:4px;height:4px;
  border-radius:50%;background:var(--lilac-deep);opacity:.8}
.day .dots{display:flex;gap:2.5px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;flex-direction:column;gap:7px;padding:12px 4px 0}
.legend .legrow{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-60);font-weight:500}
.legend .legrow b{color:var(--ink);font-weight:700;min-width:56px}
.legend .legrow .dot{margin-left:5px}

/* ---------- charts ---------- */
.chartcard{position:relative}
.chart-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:2px}
.chart-h b{font-family:var(--display);font-size:14.5px}
.chart-h span{font-size:11px;color:var(--ink-60);font-weight:500}
.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chartbox{position:relative;margin-top:2px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .target{stroke-dasharray:4 5;stroke-width:1.5;opacity:.75}
.chart .lineseries{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .end{stroke:#fff;stroke-width:2.5}
.chart .xlab{font-family:var(--num);font-size:9px;fill:var(--ink-30);font-weight:700}
.chart .tlab{font-family:var(--num);font-size:9px;font-weight:800}
.charttip{position:absolute;pointer-events:none;background:var(--ink);color:#FFF9F0;
  padding:6px 10px;border-radius:11px;font-family:var(--num);font-size:11.5px;font-weight:700;
  white-space:nowrap;opacity:0;transition:opacity .15s ease;transform:translate(-50%,-118%);z-index:5}
.charttip.on{opacity:1}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:11px 10px;text-align:center}
.stat b{display:block;font-family:var(--num);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--ink-60);font-weight:600}

/* ---------- settings ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px}
.row+.row{border-top:1px solid var(--line)}
.row .rl{font-size:13.5px;font-weight:500}
.row .rl small{display:block;font-size:11px;color:var(--ink-60);font-weight:400}
.numfield{background:var(--card);border:1px solid var(--line-gray);border-radius:var(--r-field);padding:6px 11px;display:flex;align-items:baseline;gap:4px;flex:none}
.numfield input{width:56px;border:0;background:none;font-family:var(--num);font-size:16px;
  font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.numfield input:focus{outline:none}
.numfield span{font-size:11px;color:var(--ink-60);font-weight:700}

/* ---------- feedback ---------- */
.empty{text-align:center;padding:34px 20px;color:var(--ink-60);font-size:13px}
.toast{position:absolute;left:50%;bottom:calc(var(--tabbar-total) + 92px);transform:translate(-50%,14px);z-index:60;
  background:var(--ink);color:#FFF9F0;padding:12px 20px;border-radius:var(--r-pill);
  font-family:var(--display);font-weight:700;font-size:14.5px;box-shadow:var(--shadow-pop);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .35s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast{display:flex;align-items:center;gap:14px}
.toast.has-btn.on{pointer-events:auto}
.toast-undo{font-family:var(--display);font-weight:800;font-size:13.5px;color:var(--yellow);
  padding:2px;flex:none;transition:transform .16s var(--spring)}
.toast-undo:active{transform:scale(.92)}
/* ---------- 已紀錄提示 modal ---------- */
.modal{position:absolute; inset:0; z-index:50; display:grid; place-items:center; padding:26px;
  background:rgba(61,58,78,.4); opacity:0; pointer-events:none; transition:opacity .22s ease}
.modal.open{opacity:1; pointer-events:auto}
.donecard{width:100%; max-width:290px; background:var(--card); border-radius:26px;
  padding:24px 22px 18px; box-shadow:var(--shadow-pop); text-align:center;
  display:flex; flex-direction:column; gap:8px;
  transform:scale(.88) translateY(8px); transition:transform .32s var(--spring)}
.modal.open .donecard{transform:none}
.doneicon{width:52px;height:52px;margin:0 auto 2px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--yellow),var(--pink));color:#fff;font-size:26px;font-weight:800;
  box-shadow:var(--shadow-pop)}

}

<script>
"use strict";
/* ============================ 資料層 ============================ */
const KEY = "munchi.v1";
/* MEALS 只作為儲存分桶（沿用舊資料），畫面上不再分餐別 */
const MEALS = [
  {id:"breakfast", name:"早餐", tag:"早", color:"var(--yellow)", ink:"var(--yellow-deep)"},
  {id:"lunch",     name:"午餐", tag:"午", color:"var(--pink)",   ink:"var(--pink-deep)"},
  {id:"dinner",    name:"晚餐", tag:"晚", color:"var(--blue)",   ink:"var(--blue-deep)"},
  {id:"snack",     name:"點心", tag:"點", color:"var(--lilac)",  ink:"var(--lilac-deep)"},
];
const SEED_FOODS = [
  {name:"無糖豆漿",       unit:"杯", kcal:100, protein:20, fat:5,  carbs:4},
  {name:"溏心蛋",         unit:"顆", kcal:78,  protein:6,  fat:5,  carbs:1},
  {name:"茶葉蛋",         unit:"顆", kcal:75,  protein:6,  fat:5,  carbs:1},
  {name:"希臘優格",       unit:"杯", kcal:130, protein:10, fat:4,  carbs:12},
  {name:"乳清蛋白",       unit:"匙", kcal:120, protein:24, fat:2,  carbs:3},
  {name:"健康便當（肉多）", unit:"個", kcal:550, protein:30, fat:20, carbs:55},
  {name:"舒肥雞胸",       unit:"份", kcal:165, protein:31, fat:3,  carbs:1},
  {name:"板豆腐",         unit:"塊", kcal:120, protein:13, fat:7,  carbs:3},
  {name:"毛豆",           unit:"份", kcal:100, protein:9,  fat:4,  carbs:8},
  {name:"鶴茶樓拿鐵",     unit:"杯", kcal:280, protein:9,  fat:10, carbs:35},
  {name:"白飯",           unit:"碗", kcal:280, protein:5,  fat:1,  carbs:60},
  {name:"滷雞腿便當",     unit:"個", kcal:750, protein:32, fat:30, carbs:85},
  {name:"烤地瓜",         unit:"條", kcal:130, protein:2,  fat:0,  carbs:30},
];
/* 減脂期：tdee＝維持熱量，deficit＝每天想製造的赤字，兩者相減就是當日熱量上限 */
const DEFAULTS = {tdee:1730, deficit:300, proteinTarget:105, proteinPerMeal:32, name:"Esme",
                  shareName:true, shareTargets:true,
                  /* 健身日：那天多吃 trainBonus，休息日平均補回來，一週總量不變 */
                  trainBonus:150, trainPerWeek:3, trainBalance:true, trainSince:null};

const uid = () => Math.random().toString(36).slice(2,9);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromIso = s => {const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d);};
const addDays = (d,n) => {const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const today = () => iso(new Date());
const WEEK = "日一二三四五六";
/* 補記用的日期說法：三天內講「今天、昨天、前天」，再遠就寫日期 */
function dayLabel(d){
  const diff = Math.round((fromIso(d) - fromIso(today())) / 86400000);
  if(diff === 0)  return "今天";
  if(diff === -1) return "昨天";
  if(diff === -2) return "前天";
  const x = fromIso(d);
  return `${x.getMonth()+1} 月 ${x.getDate()} 日（${WEEK[x.getDay()]}）`;
}
const shortDate = d => {const x = fromIso(d); return `${x.getMonth()+1}/${x.getDate()}`;};
/* 日期開頭的標籤接在中文後面要留一格，「昨天」這種就不用 */
const sp = s => /^\d/.test(s) ? " " + s : s;
/* 位子小的地方（按鈕、標頭）用短的：昨天／前天／9/4 */
const dayTag = d => {const l = dayLabel(d); return /^\d/.test(l) ? " " + shortDate(d) : l;};

/* 種子亂數：讓示範資料每次載入都一樣 */
function rng(seed){let h=1779033703^seed.length;
  for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);
    return ((h^=h>>>16)>>>0)/4294967296;};}

function make(name, servings){
  const f = SEED_FOODS.find(x=>x.name===name);
  return {id:uid(), name:f.name, unit:f.unit, servings,
          kcal:f.kcal, protein:f.protein, fat:f.fat, carbs:f.carbs};
}

/* 建立 28 天示範紀錄，讓月曆與趨勢一打開就有東西看 */
function demoDays(){
  const B = [[["無糖豆漿",1],["溏心蛋",2]], [["希臘優格",1],["茶葉蛋",2]], [["無糖豆漿",1],["茶葉蛋",1]]];
  const L = [[["健康便當（肉多）",1]], [["舒肥雞胸",1],["毛豆",1],["烤地瓜",1]],
             [["健康便當（肉多）",1],["無糖豆漿",1]], [["滷雞腿便當",1]]];
  const D = [[["舒肥雞胸",1],["板豆腐",1],["毛豆",1]], [["健康便當（肉多）",1]],
             [["板豆腐",1],["毛豆",1],["烤地瓜",1]], [["舒肥雞胸",1],["白飯",1]]];
  const S = [[["乳清蛋白",1]], [["無糖豆漿",1]], [["乳清蛋白",1]], [["鶴茶樓拿鐵",1]]];
  const days = {};
  for(let i=27;i>=1;i--){
    const date = iso(addDays(new Date(), -i));
    const r = rng(date);
    if(r() < 0.11) continue;                       // 偶爾忘記記錄
    const pick = a => a[Math.floor(r()*a.length)];
    const meals = {
      breakfast: pick(B).map(([n,s])=>make(n,s)),
      lunch:     pick(L).map(([n,s])=>make(n,s)),
      dinner:    r() < 0.10 ? [] : pick(D).map(([n,s])=>make(n,s)),
      snack:     pick(S).map(([n,s])=>make(n,s)),
    };
    days[date] = {date, meals};
  }
  const t = iso(new Date());
  days[t] = {date:t, meals:{breakfast:[make("無糖豆漿",1),make("溏心蛋",2)], lunch:[], dinner:[], snack:[]}};
  return days;
}

function seedState(){
  return {
    settings:{...DEFAULTS},
    favorites: SEED_FOODS.map((f,i)=>({...f, id:uid(), useCount:SEED_FOODS.length-i})),
    days: {},
  };
}
/* 舊資料只有 kcalTarget（增肌期的每日目標），轉成 TDEE 再套上預設赤字 */
function migrate(s){
  s.settings = {...DEFAULTS, ...(s.settings || {})};
  if(s.settings.kcalTarget != null){
    s.settings.tdee = s.settings.kcalTarget;
    delete s.settings.kcalTarget;
  }
  /* 健身日只從啟用當天開始算，以前的紀錄不能被追溯改判（連續天數會無辜斷掉） */
  if(!s.settings.trainSince) s.settings.trainSince = iso(new Date());
}

let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || seedState(); }catch(e){ S = seedState(); }
migrate(S);
if(!S.days[iso(new Date())]) S.days[iso(new Date())] = {date:iso(new Date()), meals:{breakfast:[],lunch:[],dinner:[],snack:[]}};
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

/* ============================ 計算 ============================ */
const sumEntries = list => list.reduce((a,e)=>({
  kcal:a.kcal+e.kcal*e.servings, protein:a.protein+e.protein*e.servings,
  fat:a.fat+(e.fat||0)*e.servings, carbs:a.carbs+(e.carbs||0)*e.servings,
}), {kcal:0,protein:0,fat:0,carbs:0});

const dayOf = d => S.days[d] || {date:d, meals:{breakfast:[],lunch:[],dinner:[],snack:[]}};
const totalsOf = d => sumEntries(MEALS.flatMap(m => dayOf(d).meals[m.id] || []));
const hasLog = d => !!S.days[d] && MEALS.some(m => (S.days[d].meals[m.id]||[]).length);
/* 減脂期：吃超過上限才是問題。上限＝TDEE − 每日赤字 */
const baseLimit  = () => Math.max(600, S.settings.tdee - S.settings.deficit);
const isTrainDay = d => !!(S.days[d] && S.days[d].train);
/* 休息日要少吃的量：bonus × 練幾次 ÷ 剩下幾天，一週加總剛好抵銷 */
const restCut = () => {
  const n = Math.min(Math.max(Math.round(S.settings.trainPerWeek) || 0, 0), 7);
  return (S.settings.trainBalance === false || n <= 0 || n >= 7)
    ? 0 : Math.round((S.settings.trainBonus || 0) * n / (7 - n));
};
const kcalLimit = (d = today()) => {
  const base = baseLimit();
  if(d < (S.settings.trainSince || today())) return base;      // 啟用前的日子照舊
  return Math.max(600, base + (isTrainDay(d) ? (S.settings.trainBonus || 0) : -restCut()));
};
const deficitOf = t => S.settings.tdee - t.kcal;               // 正數＝赤字，負數＝盈餘
const kcalHit = (t, d) => t.kcal <= kcalLimit(d);
const proHit  = t => t.protein >= S.settings.proteinTarget;
const dayHit  = (t, d) => kcalHit(t, d) && proHit(t);                  // 雙達標＝赤字有做到＋蛋白質吃夠
const tooLow  = (t, d) => t.kcal < kcalLimit(d)*0.7;                 // 赤字開太大的提醒線

/* ============================ 連續達標 ============================ */
const yesterdayIso = () => iso(addDays(new Date(), -1));
const firstLogged  = () => Object.keys(S.days).sort()[0] || today();

/* 從 endIso 往前數連續雙達標幾天。沒記錄的日子蛋白質是 0，dayHit 自然為 false，
   所以空白日不用特別處理，它天生就會斷 */
function streakUntil(endIso){
  const first = firstLogged();
  let n = 0, d = endIso;
  while(d >= first){
    if(!dayHit(totalsOf(d), d)) break;
    n++;
    d = iso(addDays(fromIso(d), -1));
  }
  return n;
}
/* 今天還沒過完，所以今天只加分不扣分：連續從昨天往前數，今天達標才 +1。
   一天還沒結束就說你斷了，是最傷人的設計 */
const streakNow     = () => streakUntil(yesterdayIso()) + (dayHit(totalsOf(today()), today()) ? 1 : 0);
const streakPending = () => !dayHit(totalsOf(today()), today()) && streakUntil(yesterdayIso()) > 0;
/* 保底：從來沒有雙達標過的人，至少還有「連續記錄」可以看，不要讓他看到「連續 0 天」 */
function logStreak(){
  const first = firstLogged();
  let n = 0, d = today();
  if(!hasLog(d)) d = iso(addDays(fromIso(d), -1));   // 今天還沒記不算斷
  while(d >= first && hasLog(d)){ n++; d = iso(addDays(fromIso(d), -1)); }
  return n;
}
/* 歷史最長連續，斷掉的時候拿來安慰用 */
function bestStreak(){
  const hits = Object.keys(S.days).filter(d => dayHit(totalsOf(d), d)).sort();
  let best = 0, run = 0, prev = null;
  for(const d of hits){
    run = (prev && d === iso(addDays(fromIso(prev), 1))) ? run + 1 : 1;
    prev = d;
    if(run > best) best = run;
  }
  return best;
}

/* 里程碑：只有剛好踩到的那天才有特殊文字，隔天回到平常文案。
   如果每天都特別，就沒有一天特別 */
const MILESTONES = {
  3:  "連續 3 天，開始有形狀了喵。",
  5:  "連 5 天。這已經不是運氣了。",
  7:  "一整週雙達標，我把最大的罐頭留給你。",
  10: "兩位數了喵，我開始有點佩服你。",
  14: "兩週。身體大概自己有感覺了吧？",
  21: "21 天。這不是意志力了，是生活。",
  30: "整整一個月。你比我還規律。",
  50: "50 天。飯盆已經沒有東西可以教你了。",
  66: "66 天，習慣養成的平均天數，你到了。",
  100:"100 天。飯盆宣布退休，之後你自己管。",
};
const MILES = [3,5,7,10,14,21,30,50,66,100];
const isMilestone = n => n >= 3 && (MILESTONES[n] != null || (n > 100 && n % 50 === 0));
const milestoneWord = n => MILESTONES[n] || (isMilestone(n) ? `連續 ${n} 天，我已經數不動了喵。` : "");
const nextMilestone = n => MILES.find(m => m > n) || (Math.floor(n/50) + 1) * 50;

/* 平常日的文案池。{n} 連續天數、{next} 下一個里程碑、{gap} 還差幾天、
   {best} 歷史最長、{log} 連續記錄天數、{left} 還差蛋白質、{room} 還能吃多少 */
const STREAK_TALK = {
  run: [
    "連續 <b>{n}</b> 天雙達標，飯盆很滿意。",
    "第 <b>{n}</b> 天了，再 <b>{gap}</b> 天就滿 {next} 天喵。",
    "連 <b>{n}</b> 天。這種穩定比爆發有用。",
  ],
  pending: [
    "連續 <b>{n}</b> 天還撐著，今天再補 <b>{left}</b> g 蛋白質就續上了。",
    "<b>{n}</b> 天的紀錄在你手上，今天還有 <b>{room}</b> kcal 可以用。",
    "今天還沒收工喔，別讓 <b>{n}</b> 天在最後一餐翻船。",
  ],
  broke: [
    "連續在前幾天停下了。前面那 <b>{best}</b> 天不會消失喵。",
    "斷了就斷了，今天重新開一輪就好。",
    "最長紀錄還留著：<b>{best}</b> 天。要不要挑戰看看？",
  ],
  none: [
    "已經連續記錄 <b>{log}</b> 天了，記錄本身就是一半的成功。",
    "先求有記，達標慢慢來喵。",
  ],
  one: [
    "連續 1 天。明天再來一次，就叫做連續了。",
  ],
};
/* 健身日限定：多出來的額度引導吃碳水，不做碳水達標判定 */
const TRAIN_TALK = [
  "今天有練，多的 <b>{room}</b> kcal 拿去吃碗飯喵。",
  "練完的碳水不是壞人，是把肝醣補回去。",
  "有練的日子飯盆會多裝一點，別客氣。",
];
const fillVars = (line, vals) => line.replace(/\{(\w+)\}/g, (m, k) => k in vals ? vals[k] : m);

function streakVars(d){
  const t = totalsOf(d);
  const n = d === today() ? streakNow() : streakUntil(d);
  const next = nextMilestone(n);
  return {n, next, gap: next - n, best: bestStreak(), log: logStreak(),
          left: r0(Math.max(S.settings.proteinTarget - t.protein, 0)),
          room: r0(Math.max(kcalLimit(d) - t.kcal, 0))};
}
/* ============================ 畫面 ============================ */
const $ = s => document.querySelector(s);
const view = $("#view");
let tab = "today", selDate = iso(new Date()), calMonth = new Date(), trendRange = 7, lastHit = dayHit(totalsOf(today()), today());

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r0 = n => Math.round(n);

function render(){
  document.querySelectorAll(".tab").forEach(b =>
    b.setAttribute("aria-current", b.dataset.tab===tab ? "page" : "false"));
  $("#fab").style.display = tab==="today" ? "grid" : "none";
  $("#shareToday").style.display = tab==="today" ? "" : "none";
  openRow = null; drag = null;
  view.innerHTML = ({today:viewToday, history:viewHistory, trends:viewTrends, settings:viewSettings})[tab]();
  view.firstElementChild && view.firstElementChild.classList.add("fade");
  if(tab==="today"){ paintBars(); paintCatBubble(); prepareCard(today()); }
  if(tab==="trends") drawCharts();
  view.scrollTop = 0;
}

/* 先看名字關鍵字，認不出來再用營養素判斷 */
const FOOD_KEYS = [
  ["dairy", /優格|優酪|乳清|牛奶|鮮奶|起司|乳酪/],
  ["egg",   /蛋(?![白糕])/],
  ["drink", /拿鐵|咖啡|奶茶|紅茶|綠茶|果汁|可樂|飲料|冰沙/],
  ["soy",   /豆漿|豆腐|豆干|毛豆|黃豆|天貝|素/],
  ["bento", /便當|餐盒|自助餐|快餐/],
  ["fried", /炸|鹹酥|薯條|天婦羅|可樂餅/],
  ["meat",  /雞|豬|牛|羊|魚|蝦|鮭|鮪|肉|排/],
  ["sweet", /蛋糕|餅乾|巧克力|冰淇淋|甜點|布丁|麵包(?=.*甜)|糖/],
  ["carb",  /飯|麵|粥|吐司|麵包|地瓜|馬鈴薯|饅頭|水餃|包子/],
  ["veg",   /菜|沙拉|花椰|菇|海帶|番茄|小黃瓜/],
];
function foodMood(e){
  for(const [key, re] of FOOD_KEYS) if(re.test(e.name)) return key;
  const kcal = e.kcal * e.servings, pro = e.protein * e.servings;
  if(kcal >= 500) return "heavy";
  if(kcal > 0 && pro / kcal >= 0.09) return "meat";   // 每 100 kcal 有 9 g 以上蛋白質
  if(kcal <= 120) return "light";
  return "def";
}
function hashStr(s){ let h = 0; for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0; return h; }

let catNudge = 0;   // 點一下泡泡就換下一句
function catBubbleHtml(){
  const t = totalsOf(iso(new Date()));
  const log = MEALS.flatMap(m => dayOf(iso(new Date())).meals[m.id] || []);
  const last = log[log.length - 1];
  const room = kcalLimit() - t.kcal, left = S.settings.proteinTarget - t.protein;

  /* 里程碑當天只講這件事，別跟食物文案搶 */
  const sv = streakVars(iso(new Date()));
  if(dayHit(t) && isMilestone(sv.n)) return milestoneWord(sv.n);

  let pool;
  if(!last)          pool = CAT_TALK.empty;
  else if(room < 0)  pool = CAT_TALK.over;
  else if(dayHit(t)) pool = CAT_TALK.done.concat(CAT_TALK[foodMood(last)] || CAT_TALK.def);
  else               pool = CAT_TALK[foodMood(last)] || CAT_TALK.def;
  /* 連續 2 天以上就讓貓咪偶爾提一下，點泡泡可以換到 */
  if(sv.n >= 2) pool = pool.concat(streakPending() ? STREAK_TALK.pending : STREAK_TALK.run);
  if(isTrainDay(today())) pool = pool.concat(TRAIN_TALK);

  /* 額度已滿／蛋白質已達標時，別講出「還差 0 g」這種怪句子 */
  const usable = pool.filter(l => (left > 0 || !l.includes("{left}"))
                               && (room > 0 || !l.includes("{room}")));
  if(usable.length) pool = usable;

  const seed = hashStr((last ? last.id + last.name : "empty") + log.length);
  const line = pool[(seed + catNudge) % pool.length];
  const vals = Object.assign({}, sv, {
    food: last ? esc(last.name) : "",
    kcal: last ? r0(last.kcal * last.servings) : 0,
    pro:  last ? r0(last.protein * last.servings) : 0,
    room: r0(Math.max(room, 0)),
    over: r0(Math.max(-room, 0)),
    left: r0(Math.max(left, 0)),
  });
  return fillVars(line, vals);
}
function paintCatBubble(){
  const b = $("#catBubble");
  if(!b) return;
  b.innerHTML = catBubbleHtml();
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
}

function paintBars(){
  const t = totalsOf(iso(new Date()));
  const limit = kcalLimit(), target = S.settings.proteinTarget;
  const set = (fill, ratio, color, over) => {
    fill.style.width = "0%";
    fill.style.backgroundColor = color;
    fill.classList.toggle("over", !!over);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      fill.style.width = Math.min(ratio,1)*100 + "%";
    }));
  };
  const pr = t.protein/target, kr = t.kcal/limit;
  set($("#proFill"),  pr, pr>=1 ? "var(--mint)" : "var(--pink)", false);
  set($("#kcalFill"), kr, kr>1  ? "var(--peach)" : "var(--yellow)", kr>1);
  tween($("#proNum"),  t.protein);
  tween($("#kcalNum"), t.kcal);
}
function tween(el, to){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent = r0(to); return; }
  const t0 = performance.now(), dur = 850;
  const step = now => {
    const p = Math.min((now-t0)/dur, 1);
    el.textContent = r0(to * (1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

      <div class="stat"><b style="color:${proHit(t)?"var(--pink-deep)":"var(--ink-30)"}">${r0(t.protein)}</b>

      <div class="stat"><b style="color:${kcalHit(t, selDate)?"var(--mint-deep)":"var(--peach-deep)"}">${def>=0?"−":"+"}${r0(Math.abs(def))}</b>
        <span>${def>=0?"赤字":"盈餘"} kcal</span></div>
    </div>` : ""}
    ${detail}
    ${addBtn}
  </div>`;
}

/* ---------------- 趨勢 ---------------- */
function viewTrends(){
  const n = trendRange;
  const dates = Array.from({length:n}, (_,i)=>iso(addDays(new Date(), -(n-1-i))));
  const logged = dates.filter(hasLog);
  const avgD = logged.length ? logged.reduce((a,d)=>a+deficitOf(totalsOf(d)),0)/logged.length : 0;
  const avgP = logged.length ? logged.reduce((a,d)=>a+totalsOf(d).protein,0)/logged.length : 0;
  const hitBoth = dates.filter(d=>hasLog(d) && dayHit(totalsOf(d), d)).length;
  const limit = baseLimit();

  return `<div class="stack">
    <div class="segrow">
      <button class="seg" data-range="7"  aria-pressed="${n===7}">近 7 天</button>
      <button class="seg" data-range="30" aria-pressed="${n===30}">近 30 天</button>
    </div>
    <div class="card statrow">
      <div class="stat"><b style="color:${avgD>=S.settings.deficit?"var(--mint-deep)":"var(--peach-deep)"}">${avgD>=0?"−":"+"}${r0(Math.abs(avgD))}</b>
        <span>平均${avgD>=0?"赤字":"盈餘"} kcal</span></div>
      <div class="stat"><b style="color:var(--pink-deep)">${r0(avgP)}</b><span>平均蛋白 g</span></div>
      <div class="stat"><b style="color:var(--mint-deep)">${hitBoth}<span style="font-size:13px;color:var(--ink-30)">/${n}</span></b><span>雙達標天</span></div>
    </div>
    <div class="card chartcard">
      <div class="chart-h"><b>熱量</b><span>虛線 = 平均上限 ${limit} kcal・壓在線下</span></div>
      <div class="chartbox"><svg class="chart" id="chartK" viewBox="0 0 320 118"></svg>
      <div class="charttip" id="tipK"></div></div>
    </div>
    <div class="card chartcard">
      <div class="chart-h"><b>蛋白質</b><span>虛線 = 目標 ${S.settings.proteinTarget} g・踩在線上</span></div>
      <div class="chartbox"><svg class="chart" id="chartP" viewBox="0 0 320 118"></svg>
      <div class="charttip" id="tipP"></div></div>
    </div>
    <div class="card note">
      <p><b class="note-t">怎麼看這兩張圖</b>
      熱量要<b>壓在虛線以下</b>、蛋白質要<b>踩在虛線以上</b>，這樣才是有赤字又留得住肌肉。
      單日超標不用緊張，看的是一週的平均。沒記錄的日子線會斷開。</p>
    </div>
  </div>`;
}

function drawCharts(){
  const n = trendRange;
  const dates = Array.from({length:n}, (_,i)=>iso(addDays(new Date(), -(n-1-i))));
  const kv = dates.map(d => hasLog(d) ? totalsOf(d).kcal : null);
  const pv = dates.map(d => hasLog(d) ? totalsOf(d).protein : null);
  chart($("#chartK"), $("#tipK"), dates, kv, baseLimit(), "var(--yellow-deep)", "kcal");
  chart($("#chartP"), $("#tipP"), dates, pv, S.settings.proteinTarget, "var(--pink-deep)", "g");
}

function chart(svg, tip, dates, vals, target, color, unit){
  const W = 320, H = 118, pl = 6, pr = 34, pt = 12, pb = 18;
  const nums = vals.filter(v=>v!=null);
  const max = Math.max(target*1.25, ...(nums.length?nums:[target]))*1.02;
  const x = i => pl + (W-pl-pr) * (vals.length<2 ? .5 : i/(vals.length-1));
  const y = v => pt + (H-pt-pb) * (1 - v/max);
  const NS = "http://www.w3.org/2000/svg";
  const el = (t,a) => {const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e;};

  svg.innerHTML = "";
  // 基準線
  [0.5, 1].forEach(f => svg.appendChild(el("line",{class:"grid", x1:pl, x2:W-pr, y1:y(max*f*0.8), y2:y(max*f*0.8)})));
  svg.appendChild(el("line",{class:"target", x1:pl, x2:W-pr, y1:y(target), y2:y(target), stroke:color}));
  const tl = el("text",{class:"tlab", x:W-pr+5, y:y(target)+3.2, fill:color}); tl.textContent = target;
  svg.appendChild(tl);

  // 連續線段（沒記錄的日子斷開）
  let seg = [];
  const flush = () => {
    if(seg.length>1){
      svg.appendChild(el("path",{class:"lineseries", stroke:color,
        d:"M"+seg.map(p=>`${p[0]},${p[1]}`).join("L")}));
      svg.appendChild(el("path",{fill:color, "fill-opacity":".10", stroke:"none",
        d:`M${seg[0][0]},${y(0)}L`+seg.map(p=>`${p[0]},${p[1]}`).join("L")+`L${seg[seg.length-1][0]},${y(0)}Z`}));
    } else if(seg.length===1){
      svg.appendChild(el("circle",{cx:seg[0][0], cy:seg[0][1], r:2.6, fill:color}));
    }
    seg = [];
  };
  vals.forEach((v,i) => { if(v==null) flush(); else seg.push([x(i), y(v)]); });
  flush();

  // 最新一點強調
  const lastI = vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
  if(lastI!=null && lastI>=0){
    svg.appendChild(el("circle",{class:"end", cx:x(lastI), cy:y(vals[lastI]), r:4.5, fill:color}));
  }
  // X 軸標籤（頭尾）
  const lab = (i,txt) => {const t=el("text",{class:"xlab", x:x(i), y:H-4, "text-anchor":i===0?"start":"end"}); t.textContent=txt; svg.appendChild(t);};
  lab(0, `${fromIso(dates[0]).getMonth()+1}/${fromIso(dates[0]).getDate()}`);
  lab(dates.length-1, "今天");

  // hover / tap 提示
  const hit = el("rect",{x:0,y:0,width:W,height:H,fill:"transparent"});
  svg.appendChild(hit);
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const cx = ((ev.touches?ev.touches[0].clientX:ev.clientX) - r.left) / r.width * W;
    let i = Math.round((cx-pl)/((W-pl-pr)/Math.max(vals.length-1,1)));
    i = Math.max(0, Math.min(vals.length-1, i));
    const d = fromIso(dates[i]);
    tip.textContent = vals[i]==null ? `${d.getMonth()+1}/${d.getDate()}　沒有記錄`
                                    : `${d.getMonth()+1}/${d.getDate()}　${r0(vals[i])} ${unit}`;
    tip.style.left = (x(i)/W*100) + "%";
    tip.style.top  = ((vals[i]==null ? y(max*0.5) : y(vals[i]))/118*100) + "%";
    tip.classList.add("on");
  };
  svg.addEventListener("mousemove", move);
  svg.addEventListener("touchmove", move, {passive:true});
  svg.addEventListener("mouseleave", ()=>tip.classList.remove("on"));
  svg.addEventListener("touchend", ()=>setTimeout(()=>tip.classList.remove("on"), 1400));
}

function exportMd(){
  const dates = Object.keys(S.days).filter(hasLog).sort().reverse();
  return dates.map(d=>{
    const t = totalsOf(d);
    const rows = MEALS.flatMap(m => (dayOf(d).meals[m.id]||[]).map(e =>
      `| ${e.name}${e.servings!==1?` ×${e.servings}`:""} | ${r0(e.kcal*e.servings)} kcal | ${r0(e.protein*e.servings)} g |`));
    return `### ${d}\n\n| 內容 | 熱量 | 蛋白質 |\n|---|---|---|\n${rows.join("\n")}\n| **當日累計** | **${r0(t.kcal)} kcal** | **${r0(t.protein)} g** |`;
  }).join("\n\n");
}

let cardArt;
function loadArt(){
  if(cardArt !== undefined) return Promise.resolve(cardArt);
  return new Promise(res => {
    const im = new Image();
    im.onload  = () => res(cardArt = im);
    im.onerror = () => res(cardArt = null);   // 載不到就不畫插圖，不讓整張圖失敗
    im.src = CARD_ART;
  });
}
/* 字體一定要等載入完，不然畫出來是系統預設字。
   Noto Sans TC 是按字切片下載的，要把真的會畫的字傳進去，對應的那幾片才會抓下來 */
async function readyFonts(text){
  if(!document.fonts) return;
  try{
    await Promise.all([
      document.fonts.load(CARD_FONT("400 14px"), text),
      document.fonts.load(CARD_FONT("500 14px"), text),
      document.fonts.load(CARD_NUM("500 36px"), text),
    ]);
    await document.fonts.ready;
  }catch(e){}
}
/* 超長就截字加 …（名字太長會把那句話撐出圖卡） */
function ellip(x, str, max){
  if(x.measureText(str).width <= max) return str;
  let lo = 0, hi = str.length;
  while(lo < hi){
    const mid = (lo + hi + 1) >> 1;
    if(x.measureText(str.slice(0, mid) + "…").width <= max) lo = mid; else hi = mid - 1;
  }
  return str.slice(0, lo) + "…";
}

async function renderCard(d){
  const t = totalsOf(d), def = deficitOf(t), dObj = fromIso(d);
  const date = `${dObj.getMonth()+1}/${dObj.getDate()} （${WEEK[dObj.getDay()]}）`;
  /* 正負號用全形「－＋」，跟設計稿一樣寬；剛好打平就只寫 0，不要出現「－0」 */
  const k = r0(Math.abs(def));
  const kcal = (k === 0 ? "" : def > 0 ? "－" : "＋") + k;
  const pro  = String(r0(t.protein));
  const name = S.settings.shareName === false ? "" : `@${S.settings.name || "Esme"}`;
  const tail = `已經連續記錄${logStreak()}天！`;
  await readyFonts(date + kcal + pro + name + tail + "熱量(kcal)蛋白質(g)…");
  await loadArt();

  const cv = document.createElement("canvas");
  cv.width = CARD_W; cv.height = CARD_H;
  const x = cv.getContext("2d");
  x.scale(CARD_S, CARD_S);

  /* 1. 背景漸層 */
  const g = x.createLinearGradient(0, -9, 360, 450);
  g.addColorStop(0, "#FFF8D4"); g.addColorStop(1, "#FFE2F1");
  x.fillStyle = g; x.fillRect(0, 0, 360, 450);

  x.textAlign = "center";

  /* 2. 日期 */
  x.font = CARD_FONT("400 14px"); x.fillStyle = "#6D6B51";
  x.fillText(date, 180, 52);

  /* 3. 熱量、蛋白質：左右兩欄（25–180、180–335）各自置中 */
  [[102.5, kcal, "熱量(kcal)"], [257.5, pro, "蛋白質(g)"]].forEach(([cx, num, label]) => {
    x.font = CARD_NUM("500 36px"); x.fillStyle = "#434126";
    x.fillText(num, cx, 111);
    x.font = CARD_FONT("400 14px"); x.fillStyle = "#616060";
    x.fillText(label, cx, 140);
  });

  /* 4. 插圖 */
  if(cardArt) x.drawImage(cardArt, 80, 148, 200, 200);

  /* 5. 連續記錄：左右各留 24，名字太長只截名字，後半句保持完整 */
  x.font = CARD_FONT("500 14px"); x.fillStyle = "#434126";
  const room = 312 - x.measureText(tail).width;
  x.fillText((name && ellip(x, name, room)) + tail, 180, 401);

  return cv;
}

function cardAlt(d){
  const t = totalsOf(d), def = deficitOf(t), dObj = fromIso(d);
  return `${dObj.getMonth()+1} 月 ${dObj.getDate()} 日，`
       + `熱量${def >= 0 ? "赤字" : "盈餘"} ${r0(Math.abs(def))} kcal，蛋白質 ${r0(t.protein)} g，`
       + `已經連續記錄 ${logStreak()} 天`;
}

/* iOS 規定 navigator.share() 要在使用者手勢的同一個 task 裡呼叫，
   而 toBlob 是非同步的 → 首頁一畫好就先把今天的 PNG 產好放著，右上角按鈕只負責分享 */
let cardBlob = null, cardUrl = null, cardDate = null, cardKey = "", cardJob = 0, cardFailed = false;
/* 圖卡上會出現的東西；沒變就不重畫（首頁每次 render 都會叫到） */
function cardKeyOf(d){
  const t = totalsOf(d);
  return [d, r0(deficitOf(t)), r0(t.protein), logStreak(),
          S.settings.shareName === false ? "" : S.settings.name].join("|");
}
function releaseCard(){
  if(cardUrl) URL.revokeObjectURL(cardUrl);
  cardBlob = null; cardUrl = null; cardDate = null; cardKey = "";
}
async function prepareCard(d){
  const key = cardKeyOf(d);
  if(key === cardKey) return;
  releaseCard();
  cardKey = key; cardFailed = false;
  const job = ++cardJob;
  if(!hasLog(d)) return;
  try{
    const cv = await renderCard(d);
    const blob = await new Promise(res => cv.toBlob(res, "image/png"));
    if(!blob) throw new Error("toBlob 沒有回傳");
    if(job !== cardJob) return;            // 畫到一半資料又變了，交給比較新的那次
    cardBlob = blob; cardUrl = URL.createObjectURL(blob); cardDate = d;
  }catch(e){
    if(job === cardJob){ cardKey = ""; cardFailed = true; }   // 下次按分享會再試一次
  }
}
function shareCard(){
  const d = today();
  if(!hasLog(d)){ toast("今天還沒有紀錄，記一筆再來分享喵"); return; }
  if(!cardBlob || cardKey !== cardKeyOf(d)){
    toast(cardFailed ? "圖卡產不出來，晚點再試喵" : "圖卡準備中，再按一次喵");
    prepareCard(d);
    return;
  }
  const t = totalsOf(cardDate);
  const summary = `${shortDate(cardDate)} 飯盆紀錄：${r0(t.kcal)} kcal・蛋白 ${r0(t.protein)} g`;
  let file = null;
  try{ file = new File([cardBlob], `飯盆-${cardDate}.png`, {type:"image/png"}); }catch(e){}
  if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], text:summary}).catch(err => {
      if(err && err.name === "AbortError") return;   // 使用者自己取消不算失敗
      openCardModal();
    });
    return;
  }
  openCardModal();
}
function openCardModal(){
  if(!cardUrl) return;
  const img = $("#cardImg");
  img.src = cardUrl;
  img.alt = cardAlt(cardDate);
  const dl = $("#cardDl");
  dl.href = cardUrl;
  dl.download = `飯盆-${cardDate}.png`;
  $("#cardModal").classList.add("open");
}
function closeCardModal(){
  const m = $("#cardModal");
  if(!m || !m.classList.contains("open")) return;
  m.classList.remove("open");
  $("#cardImg").src = "";
}

/* ============================ 記錄面板 ============================ */
let sheetMeal = "breakfast";
let sheetMode = "add";      // add＝記今天，backfill＝補記過去某天，edit＝修改既有那筆
let logDate = today();      // 這次要寫進哪一天；補記時＝過去的某一天
let editId = null;
const emptyDraft = () => ({name:"", kcal:"", protein:"", save:false, servings:"1"});
let draft = emptyDraft();
function captureDraft(){
  const g = id => document.getElementById(id);
  if(!g("nfName")) return;
  draft = {name:g("nfName").value, kcal:g("nfKcal").value, protein:g("nfPro").value,
           save: g("nfSave") ? g("nfSave").checked : draft.save,
           servings: g("nfServ") ? g("nfServ").value : draft.servings};
}

/* 右下角 ＋：永遠記到今天，不需要選日期 */
function openSheet(){
  sheetMode = "add"; editId = null;
  logDate = today();
  sheetMeal = autoMeal();
  draft = emptyDraft();
  renderSheet(false);
  $("#backdrop").classList.add("open");
}
/* 補記：日期已經在月曆上選好了，這個彈窗只負責記到那一天 */
function openBackfill(d){
  if(!d || d >= today()){ openSheet(); return; }   // 今天走一般記錄；未來不能記
  sheetMode = "backfill"; editId = null;
  logDate = d;
  draft = emptyDraft();
  renderSheet(false);
  $("#backdrop").classList.add("open");
}
const SERVINGS = ["0.5", "1", "1.5", "2"];
const closeSheet = () => {
  /* 先收鍵盤再關面板：iOS 若停在輸入框聚焦狀態，視窗會維持放大／偏移造成跑版 */
  const focused = document.activeElement;
  if(focused && typeof focused.blur === "function") focused.blur();
  $("#backdrop").classList.remove("open");
  sheetMode = "add"; editId = null; logDate = today();
  window.scrollTo(0, 0);
};
/* 點今天的某一列 → 用同一個面板改內容、單份熱量／蛋白質、份數 */
function openEdit(id, d = today()){
  const hit = findEntry(id, d);
  if(!hit) return;
  const e = hit.entry;
  sheetMode = "edit"; editId = id; sheetMeal = hit.meal; logDate = d;
  draft = {name:e.name, kcal:String(e.kcal), protein:String(e.protein),
           servings:String(e.servings), save:false};
  renderSheet(false);
  $("#backdrop").classList.add("open");
}
function editSumText(){
  const k = parseFloat(draft.kcal), p = parseFloat(draft.protein), n = parseFloat(draft.servings);
  if(isNaN(k) || isNaN(p) || isNaN(n)) return "這筆合計 —";
  if(n === 1) return `這筆 <b>${r0(k)} kcal・蛋白 ${r0(p)} g</b>`;
  return `這筆合計 <b>${r0(k*n)} kcal・蛋白 ${r0(p*n)} g</b>`;
}
function autoMeal(){
  const h = new Date().getHours();
  return h<10.5 ? "breakfast" : h<14.5 ? "lunch" : h<21 ? "dinner" : "snack";
}
/* 這筆要放進哪個分桶（分桶畫面上看不到，只決定排序）。
   今天照現在幾點分；補記過去的日子沒有「現在幾點」可用，
   就接在那天最後一筆後面，讓畫面上的順序＝輸入的順序 */
function mealBucket(d){
  if(d === today()) return autoMeal();
  const day = S.days[d];
  if(day) for(let i = MEALS.length - 1; i >= 0; i--){
    if((day.meals[MEALS[i].id] || []).length) return MEALS[i].id;
  }
  return "breakfast";
}

function renderSheet(capture = true){
  if(capture) captureDraft();
  const backfill = logDate !== today();
  const list = MEALS.flatMap(x => dayOf(logDate).meals[x.id] || []);
  const dObj = fromIso(logDate);
  const s = sumEntries(list);
  const room = kcalLimit(logDate) - s.kcal, needP = S.settings.proteinTarget - s.protein;
  const headSum = (room >= 0 ? `還能吃 ${r0(room)} kcal` : `已超出上限 ${r0(-room)} kcal`)
    + `・蛋白質${needP > 0 ? `還差 ${r0(needP)} g` : `已達標`}`;
  const favs = S.favorites.slice().sort((a,b)=>b.useCount-a.useCount);
  const v = k => esc(draft[k] == null ? "" : draft[k]);
  const meal = MEALS.find(m => m.id === sheetMeal) || MEALS[0];

  const head = `
    <div class="grab"></div>
    <div class="sheet-head">
      <div>${sheetMode==="edit" ? `<div class="sheet-title">編輯紀錄${backfill ? `・${dayLabel(logDate)}` : ""}</div>`
             : sheetMode==="backfill"
               ? `<div class="sheet-title"><span class="kind-tag">補記</span>${dObj.getMonth()+1} 月 ${dObj.getDate()} 日（星期${WEEK[dObj.getDay()]}）</div>`
               : `<div class="sheet-title">記錄今天</div>`}
        <div style="font-size:11.5px;color:var(--ink-60)">${
          sheetMode==="backfill" ? `這天已記 ${list.length} 筆・` : ""}${headSum}</div></div>
      <button class="x" id="closeSheet" aria-label="關閉">✕</button>
    </div>`;

  if(sheetMode === "edit"){
    $("#sheet").innerHTML = head + `
    <div class="sheet-body">
      <div class="block">
        <div class="block-h"><b>修改這筆</b><span>${meal.name}</span></div>
        <div class="formgrid">
          <div class="field span2"><label>食物名稱<i class="req">＊</i></label>
            <input id="nfName" value="${v("name")}" placeholder="例：南椰紅咖哩雞絞肉"></div>
          <div class="field"><label>熱量 kcal（單份）<i class="req">＊</i></label>
            <input id="nfKcal" type="number" inputmode="decimal" value="${v("kcal")}" placeholder="450"></div>
          <div class="field"><label>蛋白質 g（單份）<i class="req">＊</i></label>
            <input id="nfPro" type="number" inputmode="decimal" value="${v("protein")}" placeholder="38"></div>
          <div class="field span2"><label>份數</label>
            <input id="nfServ" type="number" inputmode="decimal" step="0.5" min="0.5" value="${v("servings")}"></div>
        </div>
        <div class="editsum" id="editSum">${editSumText()}</div>
        <button class="btn btn-main" id="nfSaveEdit">儲存修改</button>
        <button class="btn btn-danger" id="nfDelEdit">刪除這筆</button>
      </div>
    </div>`;
    return;
  }

  const isBack = sheetMode === "backfill";
  const servRow = `<div class="servrow"><span>份數</span>
      <div class="segrow" role="group" aria-label="份數">${SERVINGS.map(n => `<button class="seg" data-serv="${n}"
        aria-pressed="${String(draft.servings) === n}">×${n}</button>`).join("")}</div></div>`;

  $("#sheet").innerHTML = head + `
    <div class="sheet-body">
      ${isBack ? `<div class="backnote">這些食物會記到 <b>${dayLabel(logDate)}</b>，不會算進今天</div>` : ""}
      <div class="block">
        <div class="block-h"><b>輸入食物</b><span>熱量、蛋白質填單份的</span></div>
        <div class="formgrid">
          <div class="field span2"><label>食物名稱<i class="req">＊</i></label>
            <input id="nfName" value="${v("name")}" placeholder="例：南椰紅咖哩雞絞肉"></div>
          <div class="field"><label>熱量 kcal<i class="req">＊</i></label>
            <input id="nfKcal" type="number" inputmode="decimal" value="${v("kcal")}" placeholder="450"></div>
          <div class="field"><label>蛋白質 g<i class="req">＊</i></label>
            <input id="nfPro" type="number" inputmode="decimal" value="${v("protein")}" placeholder="38"></div>
        </div>
        ${servRow}
        <div class="editsum" id="addSum">${editSumText()}</div>
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px">
          <input type="checkbox" id="nfSave" ${draft.save ? "checked" : ""}
            style="width:17px;height:17px;accent-color:var(--pink-deep)">
          存進常吃清單</label>
        <button class="btn btn-main" id="nfAdd">${isBack ? `補記到${dayTag(logDate)}` : "紀錄飯盆"}</button>
      </div>

      <div class="food-key">標籤右側數字＝單份的 熱量 kcal ／ <b>蛋白質 g</b></div>
      <div class="foodwrap">${favs.map(f=>`<button class="food" data-add="${f.id}">
        ${esc(f.name)}<span class="fm">${f.kcal}<b>${f.protein}g</b></span></button>`).join("")}</div>
    </div>`;
}

/* ---- 存下編輯結果（可復原） ---- */
function saveEdit(){
  captureDraft();
  const d = logDate;
  const hit = findEntry(editId, d);
  if(!hit){ closeSheet(); return; }
  const name = draft.name.trim();
  const kcal = parseFloat(draft.kcal), pro = parseFloat(draft.protein), serv = parseFloat(draft.servings);
  if(!name || isNaN(kcal) || isNaN(pro)){ toast("名稱、熱量、蛋白質要填"); return; }
  if(isNaN(serv) || serv <= 0){ toast("份數要大於 0"); return; }
  const before = {...hit.entry};
  Object.assign(hit.entry, {name, kcal, protein:pro, servings:serv});
  closeSheet();
  afterChange(d);
  toast(`已更新「${name}」`, () => {
    const h = findEntry(before.id, d);
    if(h) Object.assign(h.entry, before);
    afterChange(d);
  });
}

function addEntry(food, servings){
  const d = logDate;
  if(!S.days[d]) S.days[d] = {date:d, meals:{breakfast:[],lunch:[],dinner:[],snack:[]}};
  S.days[d].meals[mealBucket(d)].push({id:uid(), name:food.name,
    unit:food.unit||"份", servings, kcal:food.kcal, protein:food.protein,
    fat:food.fat||0, carbs:food.carbs||0});
  save();
  const hit = celebrateIfHit(d);         // 剛好雙達標才會撒星星
  closeSheet();                          // 紀錄完直接收起面板
  showRecorded(food, servings, hit, d);  // 用提示 modal 告訴使用者已紀錄
  render();                              // 補記後月曆那一格也要跟著更新
}

/* 回傳「這一筆剛好讓今天雙達標（有赤字＋蛋白質夠）」，讓提示 modal 一起說。
   補記過去的日子不撒星星：那是已經發生過的事，不是現在達成的 */
function celebrateIfHit(d){
  if(d !== today()) return false;
  const now = dayHit(totalsOf(today()), today());
  const justHit = now && !lastHit;
  if(justHit) stars();
  if(justHit && isMilestone(streakNow())) setTimeout(stars, 420);   // 里程碑值得噴兩次
  lastHit = now;
  return justHit;
}

/* ---- 已紀錄提示 modal ---- */
let doneTimer = null;
function showRecorded(food, servings, justHit, d = today()){
  const t = totalsOf(d), back = d !== today();
  $("#doneTitle").textContent = back ? `已補記到${sp(dayLabel(d))}` : "已紀錄";
  $("#doneFood").innerHTML =
    `${esc(food.name)}${servings!==1?` ×${servings}`:""}　<b>${r0(food.kcal*servings)} kcal・蛋白 ${r0(food.protein*servings)} g</b>`;
  const room = kcalLimit(d) - t.kcal;
  $("#doneSum").innerHTML =
    `${back ? dayLabel(d) : "今日"}累計 ${r0(t.kcal)} / 上限 ${kcalLimit(d)} kcal`
    + `（${room>=0 ? `還能吃 ${r0(room)}` : `超出 ${r0(-room)}`} kcal）<br>`
    + `蛋白質 ${r0(t.protein)} / ${S.settings.proteinTarget} g`
    + (justHit ? `<div class="donehit">${
        isMilestone(streakNow()) ? esc(milestoneWord(streakNow())) : "赤字＋蛋白質都達標 🎉"}</div>` : "");
  $("#doneModal").classList.add("open");
  clearTimeout(doneTimer);
  /* 達標時多留一點時間，讓人看完慶祝的那句話 */
  doneTimer = setTimeout(closeDone, justHit ? 4200 : 2200);
}
function closeDone(){
  clearTimeout(doneTimer);
  $("#doneModal").classList.remove("open");
}
function toast(msg, undo){
  const t = $("#toast");
  t.innerHTML = esc(msg) + (undo ? `<button class="toast-undo" id="toastUndo">復原</button>` : "");
  t.classList.toggle("has-btn", !!undo);
  t._undo = undo || null;
  t.classList.add("on");
  clearTimeout(t._t);
  t._t = setTimeout(()=>{ t.classList.remove("on"); t._undo = null; }, undo ? 4500 : 2200);
}
function hideToast(){
  const t = $("#toast"); t.classList.remove("on"); t._undo = null; clearTimeout(t._t);
}
function stars(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const app = $("#app"), r = app.getBoundingClientRect();
  for(let i=0;i<14;i++){
    const s = document.createElement("div");
    s.className = "star";
    s.style.background = ["var(--yellow)","var(--pink)","var(--blue)","var(--mint)","var(--lilac)"][i%5];
    s.style.left = (r.width/2) + "px";
    s.style.top  = (r.height/2 - 40) + "px";
    const a = (Math.PI*2*i)/14 + Math.random()*0.4;
    s.style.setProperty("--dx", Math.cos(a)*(90+Math.random()*70)+"px");
    s.style.setProperty("--dy", Math.sin(a)*(90+Math.random()*70)+"px");
    s.style.setProperty("--rot", (Math.random()*180-90)+"deg");
    s.style.animationDelay = (i*22)+"ms";
    app.appendChild(s);
    setTimeout(()=>s.remove(), 1500);
  }
}

/* ---------------- 刪除一筆紀錄（含復原） ---------------- */
function findEntry(id, d = today()){
  const day = S.days[d];
  if(!day) return null;
  for(const m of MEALS){
    const list = day.meals[m.id] || (day.meals[m.id] = []);
    const i = list.findIndex(e => e.id === id);
    if(i > -1) return {meal:m.id, index:i, entry:list[i]};
  }
  return null;
}
function deleteEntry(id, d = today()){
  const hit = findEntry(id, d);
  if(!hit) return;
  S.days[d].meals[hit.meal].splice(hit.index, 1);
  if(sheetMode === "edit" && editId === id) closeSheet();
  afterChange(d);
  toast(`已刪除「${hit.entry.name}」`, () => {
    const list = S.days[d].meals[hit.meal];
    list.splice(Math.min(hit.index, list.length), 0, hit.entry);
    afterChange(d);
  });
}
function afterChange(d){
  save();
  if(d === today()) lastHit = dayHit(totalsOf(d), d);
  renderSheet();
  render();
}

/* ---------------- 右滑刪除 ---------------- */
const SWIPE_W    = 88;   // 刪除區寬度，對應 CSS 的 --swipe-w
const SWIPE_DIR  = 1;    // 1＝右滑露出刪除；改成 -1 就變成左滑
const SWIPE_SNAP = 30;   // 拖過這個距離就吸附打開
const SWIPE_KILL = .5;   // 一口氣滑過整列一半 → 直接刪除
let drag = null, openRow = null;

const rowFg = row => row.querySelector(".swipe-fg");
function setRow(row, x){ rowFg(row).style.transform = `translateX(${x}px)`; }
function closeRow(row){
  if(!row) return;
  rowFg(row).style.transform = "";
  row.classList.remove("open", "dragging");
  if(openRow === row) openRow = null;
}
function openRowNow(row){
  row.classList.add("open");
  setRow(row, SWIPE_DIR * SWIPE_W);
  openRow = row;
}
function removeRow(row){
  const id = row.dataset.entry, d = row.dataset.date || today();
  if(openRow === row) openRow = null;
  row.classList.remove("dragging");
  row.style.height = row.offsetHeight + "px";
  rowFg(row).style.transform = `translateX(${SWIPE_DIR * 100}%)`;
  requestAnimationFrame(()=> row.classList.add("removing"));
  setTimeout(()=> deleteEntry(id, d), 260);
}

view.addEventListener("pointerdown", ev => {
  if(ev.button) return;
  if(ev.target.closest(".swipe-del")) return;   // 交給 click 處理
  const fg = ev.target.closest(".swipe-fg");
  if(!fg){ closeRow(openRow); return; }
  const row = fg.closest(".swipe");
  if(openRow && openRow !== row) closeRow(openRow);
  drag = {row, fg, id:ev.pointerId, x0:ev.clientX, y0:ev.clientY, x:0, axis:null,
          base: row.classList.contains("open") ? SWIPE_DIR * SWIPE_W : 0};
});
view.addEventListener("pointermove", ev => {
  if(!drag || ev.pointerId !== drag.id) return;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if(!drag.axis){
    if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    if(Math.abs(dy) >= Math.abs(dx)){ drag = null; return; }   // 直向 → 交還給捲動
    drag.axis = "x";
    drag.row.classList.add("dragging");
    try{ drag.fg.setPointerCapture(drag.id); }catch(e){}
  }
  let x = drag.base + dx;
  x = SWIPE_DIR > 0 ? Math.max(0, Math.min(x, drag.row.offsetWidth))
                    : Math.min(0, Math.max(x, -drag.row.offsetWidth));
  drag.x = x;
  setRow(drag.row, x);
});
function endDrag(ev){
  if(!drag || (ev.pointerId != null && ev.pointerId !== drag.id)) return;
  const {row, axis, x} = drag;
  drag = null;
  row.classList.remove("dragging");
  if(axis !== "x"){                              // 只是點一下 → 編輯這筆
    if(row.classList.contains("open")) closeRow(row);
    else openEdit(row.dataset.entry, row.dataset.date || today());
    return;
  }
  if(Math.abs(x) >= row.offsetWidth * SWIPE_KILL) removeRow(row);
  else if(Math.abs(x) >= SWIPE_SNAP) openRowNow(row);
  else closeRow(row);
}
view.addEventListener("pointerup", endDrag);
view.addEventListener("pointercancel", endDrag);
view.addEventListener("scroll", ()=> closeRow(openRow), {passive:true});

/* ============================ 事件 ============================ */
document.addEventListener("click", ev => {
  const hit = sel => ev.target.closest(sel);
  let el;

  if((el = hit(".tab")))        { tab = el.dataset.tab; render(); return; }
  if(hit("#fab"))               { openSheet(); return; }
  if(hit("#catBubble"))         { catNudge++; paintCatBubble(); return; }
  if(hit("#closeSheet"))        { closeSheet(); return; }
  if(ev.target.id === "backdrop"){ closeSheet(); return; }
  if(hit("#doneOk") || ev.target.id === "doneModal"){ closeDone(); return; }

  /* ---- 分享 ---- */
  if(hit("#shareToday"))        { shareCard(); return; }
  if(hit("#cardClose") || ev.target.id === "cardModal"){ closeCardModal(); return; }
  if((el = hit("[data-train]"))){
    const d = el.dataset.train;
    if(!S.days[d]) S.days[d] = {date:d, meals:{breakfast:[],lunch:[],dinner:[],snack:[]}};
    S.days[d].train = !S.days[d].train;
    save();
    /* 上限變了，達標狀態要跟著重算，免得下一筆紀錄誤放彩帶 */
    if(d === today()) lastHit = dayHit(totalsOf(d), d);
    render();
    toast(S.days[d].train ? `標成健身日，可以多吃 ${r0(S.settings.trainBonus || 0)} kcal` : "已取消健身日");
    return;
  }
  if((el = hit("[data-toggle]"))){
    const k = el.dataset.toggle;
    S.settings[k] = !(S.settings[k] !== false);
    save(); render(); return;
  }

  if((el = hit("[data-add]")))   {
    const f = S.favorites.find(x=>x.id===el.dataset.add);
    if(!f) return;
    /* 只把資料帶進上方輸入區，讓使用者確認／微調後再按「紀錄飯盆」 */
    /* 份數沿用剛剛選的：先點 ×2 再點標籤，不該被打回 ×1 */
    captureDraft();
    draft = {name:f.name, kcal:String(f.kcal), protein:String(f.protein),
             save:false, servings:draft.servings || "1"};
    renderSheet(false);
    const body = $("#sheet .sheet-body"); if(body) body.scrollTop = 0;
    toast(`已帶入「${f.name}」，確認份數後送出`);
    return;
  }
  if((el = hit("[data-swipedel]"))){ removeRow(el.closest(".swipe")); return; }
  if(hit("#toastUndo"))          { const fn = $("#toast")._undo; hideToast(); if(fn) fn(); return; }
  if(hit("#nfSaveEdit"))        { saveEdit(); return; }
  if(hit("#nfDelEdit"))         { deleteEntry(editId, logDate); return; }
  if(hit("#nfAdd"))             {
    captureDraft();
    const name = draft.name.trim();
    const kcal = parseFloat(draft.kcal), pro = parseFloat(draft.protein);
    const serv = parseFloat(draft.servings);
    if(!name || isNaN(kcal) || isNaN(pro)){ toast("名稱、熱量、蛋白質要填"); return; }
    if(isNaN(serv) || serv <= 0){ toast("份數要大於 0"); return; }
    const food = {name, unit:"份", kcal, protein:pro, fat:0, carbs:0};
    const fav = S.favorites.find(x => x.name === name);
    if(fav){ fav.useCount++; fav.lastUsedAt = new Date().toISOString(); }
    else if(draft.save) S.favorites.push({...food, id:uid(), useCount:1, lastUsedAt:new Date().toISOString()});
    ["nfName","nfKcal","nfPro"].forEach(id=>{
      const e = document.getElementById(id); if(e) e.value = "";
    });
    draft = emptyDraft();
    addEntry(food, serv); return;
  }

  if((el = hit("[data-backfill]"))){ openBackfill(el.dataset.backfill); return; }
  /* 選份數只換按鈕狀態與合計，不重畫整個面板，打到一半的字和鍵盤都不會被打斷 */
  if((el = hit("[data-serv]")))    {
    captureDraft();
    draft.servings = el.dataset.serv;
    document.querySelectorAll("[data-serv]").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.serv === draft.servings));
    const sum = $("#addSum"); if(sum) sum.innerHTML = editSumText();
    return;
  }
  if((el = hit("[data-day]")))  { selDate = el.dataset.day; render(); return; }
  if((el = hit("[data-mon]")))  { calMonth.setMonth(calMonth.getMonth()+Number(el.dataset.mon)); render(); return; }
  if((el = hit("[data-range]"))){ trendRange = Number(el.dataset.range); render(); return; }
  if((el = hit("[data-delfav]"))){ S.favorites = S.favorites.filter(f=>f.id!==el.dataset.delfav); save(); render(); return; }
  if((el = hit("[data-export]"))){
    const text = el.dataset.export==="md" ? exportMd() : JSON.stringify(S, null, 2);
    navigator.clipboard.writeText(text).then(()=>toast("已複製到剪貼簿"), ()=>toast("複製失敗，請手動選取"));
    return;
  }
  if(hit("#reset"))             { if(!confirm("要清空所有紀錄嗎？這個動作沒辦法復原。")) return; S = seedState(); save(); lastHit = false; render(); toast("已清空所有紀錄"); return; }
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-set]");
  if(!el) return;
  const k = el.dataset.set, v = parseFloat(el.value);
  const zeroOk = k === "trainBonus" || k === "trainPerWeek";   // 填 0 等於關掉健身日
  if(isNaN(v) || v < 0 || (!zeroOk && v <= 0)) return;
  S.settings[k] = k === "trainPerWeek" ? Math.min(7, Math.round(v)) : v;
  save();
  if(zeroOk && tab === "settings") render();                   // 讓下面的上限預覽跟著更新
  lastHit = dayHit(totalsOf(today()), today());
});
document.addEventListener("input", ev => {
  if(!ev.target.closest(".sheet")) return;
  captureDraft();
  const el = $("#editSum") || $("#addSum");
  if(el) el.innerHTML = editSumText();
});
document.addEventListener("keydown", ev => {
  if(ev.key==="Escape"){
    if($("#cardModal").classList.contains("open")){ closeCardModal(); return; }
    closeDone(); closeSheet(); return;
  }
  if(ev.key==="Enter" || ev.key===" "){
    if(ev.target.id === "catBubble"){ ev.preventDefault(); catNudge++; paintCatBubble(); return; }
    const fg = ev.target.closest && ev.target.closest(".swipe-fg");
    if(fg){ const row = fg.closest(".swipe");
            ev.preventDefault(); openEdit(row.dataset.entry, row.dataset.date || today()); }
  }
});
window.addEventListener("resize", ()=>{ if(tab==="trends") drawCharts(); });

/* 啟動 */
function renderName(){ $("#hello").textContent = S.settings.name || "Esme"; }

function startNameEdit(){
  const el = $("#hello");
  el.contentEditable = "true";
  el.spellcheck = false;
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function endNameEdit(commit){
  const el = $("#hello");
  if(el.contentEditable !== "true") return;
  el.contentEditable = "false";
  if(commit){
    const v = el.textContent.trim().slice(0,20);
    S.settings.name = v || S.settings.name || "Esme";
    save();
    if(tab === "today") prepareCard(today());   // 圖卡上有 @名字
  }
  renderName();
}
$("#editName").addEventListener("click", startNameEdit);
$("#hello").addEventListener("blur", () => endNameEdit(true));
$("#hello").addEventListener("keydown", ev => {
  if(ev.key === "Enter"){ ev.preventDefault(); endNameEdit(true); }
  if(ev.key === "Escape"){ ev.preventDefault(); endNameEdit(false); }
});

(function init(){
  if(!S.settings.name) S.settings.name = "Esme";
  renderName();
  const d = new Date();
  $("#todaydate").textContent =
    `${d.getMonth()+1} 月 ${d.getDate()} 日・星期${"日一二三四五六"[d.getDay()]}`;
  render();
})();
</script>

<style id="pwa-shell">
html{background:var(--cream)}
body{overscroll-behavior-y:none}
@media (display-mode:standalone),(display-mode:fullscreen){
  body{background:var(--cream)}
}
.pwa-update{
  position:fixed; left:50%; transform:translateX(-50%) translateY(12px);
  bottom:calc(84px + env(safe-area-inset-bottom)); z-index:90;
  display:flex; align-items:center; gap:10px;
  padding:10px 12px 10px 18px; border-radius:var(--r-pill);
  background:var(--card); color:var(--ink); font-size:14px; font-weight:500;
  box-shadow:var(--shadow-pop); opacity:0; pointer-events:none;
  transition:opacity .24s, transform .3s var(--spring);
}
.pwa-update[data-show="1"]{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto}
.pwa-update button{
  padding:7px 16px; border-radius:var(--r-pill);
  background:var(--pink-cta); color:#fff; font-weight:700; font-size:14px;
  transition:transform .18s var(--spring);
}
.pwa-update button:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){
  .pwa-update{transition:opacity .2s; transform:translateX(-50%)}
  .pwa-update[data-show="1"]{transform:translateX(-50%)}
}
</style>

<div class="pwa-update" id="pwaUpdate" role="status">
  <span>有新版本囉</span>
  <button type="button" id="pwaUpdateBtn">更新</button>
</div>

<script>
/* ---------- PWA：註冊 service worker、提示更新 ---------- */
(function(){
  "use strict";
  if(!("serviceWorker" in navigator)) return;
  var bar = document.getElementById("pwaUpdate");
  var btn = document.getElementById("pwaUpdateBtn");
  var waiting = null, reloading = false;

  function offerUpdate(sw){
    waiting = sw;
    bar.setAttribute("data-show", "1");
  }
  btn.addEventListener("click", function(){
    bar.removeAttribute("data-show");
    if(waiting) waiting.postMessage({type:"SKIP_WAITING"});
  });
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js", {scope:"./"}).then(function(reg){
      if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener("statechange", function(){
          if(sw.state === "installed" && navigator.serviceWorker.controller) offerUpdate(sw);
        });
      });
      /* 每次切回 App 就問一次有沒有新版 */
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible") reg.update().catch(function(){});
      });
    }).catch(function(){});
  });
})();
</script>
